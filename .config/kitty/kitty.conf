# vim:ft=conf

#: Theme {{{
include theme.conf
#: }}}

#: Fonts {{{
# font_family      JetBrains Nerd Font
font_family       UbuntuMono Nerd Font Mono
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         15.0
#: }}}

#: Cursor {{{
shell_integration no-rc
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
#: }}}

#: URLs {{{
url_color #278bd3
url_style dashed
detect_urls yes
#: }}}

#: Appearance {{{
background_opacity 0.88
#: }}}

#: Window {{{
remember_window_size yes
hide_window_decorations yes
draw_minimal_borders yes
window_border_width 0.1
box_drawing_scale 0.001, 0.70, 0.70, 0.70
#: }}}

#: Performance {{{
term xterm-kitty
repaint_delay 10
input_delay 3
sync_to_monitor no
scrollback_lines 10000
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set readonly nolist' +'$' -
wheel_scroll_multiplier 5.0
click_interval 0.5
mouse_hide_wait 0.0
#: }}}

#: Behavior {{{
enable_audio_bell no
visual_bell_duration 0.0
strip_trailing_spaces never
copy_on_select yes
disable_ligatures never
select_by_word_characters :@-./_~?&=%+#
close_on_child_death yes
clipboard_control write-clipboard write-primary read-clipboard read-primary
allow_remote_control yes
listen_on unix:/tmp/kitty
enabled_layouts tall,splits
tab_bar_filter session:~ or session:^$
startup_session ~/.config/kitty/sessions/home.kitty-session
#: }}}

#: Tabs {{{
#: Bar position
tab_bar_edge            bottom
tab_bar_min_tabs        1

#: Style
tab_bar_style           powerline
tab_powerline_style     angled
tab_separator           " |"

#: Margins
tab_bar_margin_width    0.0
tab_bar_margin_height   0.0 0.0

#: Title
tab_title_template "{index}: {title[:15]}{"…" if len(title) > 15 else ""}{bell_symbol}"
active_tab_title_template   "{fmt.bold}{index}: {title[:15]}{"…" if len(title) > 15 else ""}{activity_symbol}{fmt.nobold}"
bell_on_tab                " * "
tab_activity_symbol         "+ "

#: }}}

#: Keyboard shortcuts {{{
clear_all_shortcuts yes

#: Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v combine : paste_from_clipboard : clear_selection
map alt+p combine : paste_from_clipboard : clear_selection

#: Hints & Unicode
map ctrl+space kitten hints --type line
map opt+insert kitten unicode_input

#: Scrolling
map opt+k scroll_line_up
map opt+j scroll_line_down
map opt+u scroll_page_up
map opt+d scroll_page_down
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down

#: Font size
map opt+shift+k change_font_size all +1.0
map opt+shift+j change_font_size all -1.0
map opt+shift+space change_font_size all 0
#: }}}

#: Modal mode — tmux-like prefix (Ctrl+S then key, Esc to quit) {{{
map --new-mode mw --on-action end ctrl+s
map --mode mw esc pop_keyboard_mode

#: Window navigation (vim-style)
map --mode mw h         neighboring_window left
map --mode mw j         neighboring_window down
map --mode mw k         neighboring_window up
map --mode mw l         neighboring_window right

#: Move window
map --mode mw shift+h   move_window left
map --mode mw shift+j   move_window down
map --mode mw shift+k   move_window up
map --mode mw shift+l   move_window right

#: Resize window
# map --mode mw n         resize_window narrower
map --mode mw b         resize_window wider
map --mode mw t         resize_window taller
map --mode mw s         resize_window shorter

#: Split & window management
map --mode mw enter      launch --cwd=current
map --mode mw shift+0x27 launch --cwd=current --location=hsplit
map --mode mw %          launch --cwd=current --location=vsplit
map --mode mw x          close_window
map --mode mw space      next_window
map --mode mw z          toggle_fullscreen
map --mode mw tab        nth_window -1
map --mode mw 1          first_window
map --mode mw 2          second_window
map --mode mw 3          third_window

#: Tab management
map --mode mw c         launch --cwd=current --type=tab
map --mode mw n         next_tab
map --mode mw p         previous_tab
map --mode mw q         close_tab
map --mode mw ,         set_tab_title

#: Scrollback
# map --mode mw [         launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay /bin/bash -c 'sed "s/[[:space:]]*$//" | nvim +"nnoremap q ZQ" +"tnoremap <Esc> <C-\\><C-n>" +"call nvim_open_term(0, {})" +"stopinsert" +"set number relativenumber" +"$" -'
map --mode mw [         launch --stdin-source=@screen_scrollback --type=overlay /bin/bash ~/.config/kitty/scripts/scrollback-overlay.sh
map --mode mw ]         show_scrollback

#: Layout
map --mode mw o         next_layout

#: Sessions
map --mode mw ctrl+h     goto_session ~/.config/kitty/sessions/home.kitty-session
map --mode mw ctrl+p     goto_session ~/.config/kitty/sessions/projects.kitty-session
map --mode mw w          launch --type=overlay ~/.config/kitty/scripts/kitty-list-sessions.sh
map --mode mw f          launch --type=overlay ~/.config/kitty/scripts/kitty-new-session.sh
# map --mode mw ctrl+l     goto_session -1
map --mode mw ctrl+s     save_as_session --use-foreground-process --relocatable
#: }}}

#: Global shortcuts {{{
#: Resize — Ctrl+Alt+hjkl
map ctrl+alt+h resize_window narrower 2
map ctrl+alt+j resize_window shorter 2
map ctrl+alt+k resize_window taller 2
map ctrl+alt+l resize_window wider 2

#: Tab selection — Alt+1..9
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
#: }}}
