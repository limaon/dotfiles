# vim:ft=conf

#: ============================================================================
#: KITTY CONFIGURATION - Lima's Setup
#: ============================================================================
#: This is a comprehensive configuration file for Kitty terminal emulator.
#: Organized by sections for easy navigation and customization.
#: ============================================================================

#: Theme {{{
include theme.conf
#: }}}

#: ============================================================================
#: FONTS CONFIGURATION {{{
#: ============================================================================

#: Primary font family and variants
font_family       UbuntuMono Nerd Font Mono
bold_font         auto
italic_font       auto
bold_italic_font  auto

#: Font size in points
font_size         15.0

#: Force left-to-right text rendering (useful for RTL scripts)
force_ltr no

#: Map specific Unicode codepoints to particular fonts
#: Useful for Powerline symbols and special characters
#: Example: symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 PowerlineSymbols
# symbol_map

#: Restrict specific Unicode characters to a certain number of cells
#: Useful for Private Use Unicode characters and symbol/dingbat characters
narrow_symbols

#: Ligature handling: never, always, or cursor
#: - never: always render ligatures
#: - always: never render ligatures
#: - cursor: disable ligatures when cursor is over them
disable_ligatures never

#: OpenType features for fonts
#: Syntax: font_features <PostScript_Name> <flags>
#: Examples:
#:   font_features FiraCode-Retina +zero +onum
#:   font_features FiraCode-Bold +zero
#:   font_features TT2020StyleB-Regular -liga +calt
font_features

#: Modify font characteristics (underline, strikethrough, cell dimensions)
#: Examples:
#:   modify_font underline_position -2
#:   modify_font underline_thickness 150%
#:   modify_font strikethrough_thickness 200%
#:   modify_font strikethrough_position 2px
#:   modify_font cell_width 80%
#:   modify_font cell_height -2px
#:   modify_font baseline 3
modify_font

#: Box drawing character sizes (thin, normal, thick, very thick)
#: Values in points, scaled by monitor DPI
box_drawing_scale 0.001, 0.70, 0.70, 0.70

#: Undercurl style: (thin|thick)-(sparse|dense)
undercurl_style thin-sparse

#: Thickness of gaps in underlines when they overlap with descenders
#: Can be unitless (fraction of underline thickness), px, or pt
underline_exclusion 1

#: Text composition strategy: platform or legacy
#: Can also specify gamma adjustment and contrast: e.g., "1.0 0" or "1.7 30"
text_composition_strategy platform

#: Prevent low contrast between foreground and background
#: Examples: "4.5 ratio" (WCAG AA) or "50 %" (luminance difference)
text_fg_override_threshold 0

#: }}}

#: ============================================================================
#: TEXT CURSOR CUSTOMIZATION {{{
#: ============================================================================

#: Cursor color (or 'none' for reverse video effect)
# cursor #cccccc

#: Color of text under the cursor (or 'background' for cell background)
# cursor_text_color #111111

#: Cursor shape: block, beam, or underline
cursor_shape block

#: Cursor shape when OS window is not focused: block, beam, underline, hollow, unchanged
cursor_shape_unfocused hollow

#: Thickness of beam cursor (in pts)
# cursor_beam_thickness 1.5

#: Thickness of underline cursor (in pts)
cursor_underline_thickness 2.0

#: Cursor blink interval (in seconds)
#: Negative values use system default
#: Can include easing functions: e.g., "0.5 ease-in-out"
cursor_blink_interval 0.5

#: Stop blinking cursor after specified seconds of keyboard inactivity
cursor_stop_blinking_after 15.0

#: Cursor trail animation (in milliseconds)
#: Set to 0 to disable
cursor_trail 0

#: Cursor trail decay times (fastest slowest in seconds)
cursor_trail_decay 0.1 0.4

#: Distance threshold for starting cursor trail (cells)
cursor_trail_start_threshold 2

#: Color of cursor trail (or 'none' to use cursor background color)
cursor_trail_color none

#: }}}

#: ============================================================================
#: SCROLLBACK CONFIGURATION {{{
#: ============================================================================

#: Number of lines of history to keep in memory
#: Negative numbers = infinite scrollback
scrollback_lines 10000

#: Scrollbar display: scrolled, hovered, scrolled-and-hovered, always, never
scrollbar never

#: Allow mouse interaction with scrollbar
scrollbar_interactive yes

#: Jump to clicked location in scrollbar (vs. scroll by one screenful)
scrollbar_jump_on_click yes

#: Scrollbar width (in cell units, fractional allowed)
scrollbar_width 0.5

#: Scrollbar width when mouse hovers over it
scrollbar_hover_width 1

#: Minimum height of scrollbar handle (in cell units)
scrollbar_min_handle_height 1

#: Extra area around handle for easier grabbing (in cell units)
scrollbar_hitbox_expansion 0.25

#: Scrollbar gap from window edge (in cell units)
scrollbar_gap 0.1

#: Scrollbar handle curvature (in cell units)
scrollbar_radius 0.3

#: Scrollbar handle opacity (0 = transparent, 1 = opaque)
scrollbar_handle_opacity 0.5

#: Scrollbar track opacity
scrollbar_track_opacity 0

#: Scrollbar track opacity when mouse hovers
scrollbar_track_hover_opacity 0.1

#: Scrollbar handle color (foreground, selection_background, or hex color)
scrollbar_handle_color foreground

#: Scrollbar track color
scrollbar_track_color foreground

#: Progress bar position: top, bottom, left, right, hidden
# progress_bar top

#: Program to view scrollback in a new window
#: nvim in normal mode (powerful, regex search, copy lines, full editing)
# scrollback_pager nvim --clean --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'set readonly nolist' +'$' -
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set readonly nolist' +'$' -

#: Separate scrollback history size for pager (in MB)
# scrollback_pager_history_size 0

#: Fill new space with scrollback lines after enlarging window
# scrollback_fill_enlarged_window no

#: Mouse wheel scroll multiplier
wheel_scroll_multiplier 5.0

#: Minimum lines scrolled by mouse wheel
# wheel_scroll_min_lines 1

#: Touchpad scroll multiplier
# touch_scroll_multiplier 1.0

#: Enable per-pixel scrolling with high precision input devices
# pixel_scroll yes

#: Momentum (inertial) scrolling friction (0-1)
# momentum_scroll 0.96

#: }}}

#: ============================================================================
#: MOUSE CONFIGURATION {{{
#: ============================================================================

#: Hide mouse cursor after specified seconds of inactivity
#: Negative value = hide immediately when typing
#: Format: <hide-wait> [<unhide-wait> <unhide-threshold> <scroll-unhide>]
mouse_hide_wait 0.0

#: URL color and style
url_color #278bd3
url_style dashed

#: Program to open clicked URLs (default = OS default handler)
# open_url_with default

#: URL prefixes to detect
# url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh

#: Detect URLs under mouse cursor
detect_urls yes

#: Additional characters to disallow from URLs
# url_excluded_characters

#: Show hyperlink targets on hover: never, always, ctrl, cmd, alt, shift
# show_hyperlink_targets never

#: Underline hyperlinks: hover, always, never
# underline_hyperlinks hover

#: Copy to clipboard or private buffer on select
copy_on_select yes

#: Clear selection when clipboard owner changes
# clear_selection_on_clipboard_loss no

#: Paste actions: quote-urls-at-prompt, replace-dangerous-control-codes, replace-newline, confirm, confirm-if-large, filter, no-op
# paste_actions quote-urls-at-prompt,confirm

#: Remove trailing spaces when copying: never, smart, always
strip_trailing_spaces never

#: Characters considered part of a word when double-clicking
select_by_word_characters :@-./_~?&=%+#

#: Characters for forward word selection (empty = use select_by_word_characters)
# select_by_word_characters_forward

#: Interval between clicks for double/triple click detection (seconds)
click_interval 0.5

#: Focus follows mouse: no, yes, drop
# focus_follows_mouse no

#: Mouse pointer shape when program grabs mouse
# pointer_shape_when_grabbed arrow

#: Default mouse pointer shape
# default_pointer_shape beam

#: Mouse pointer shape when dragging text
# pointer_shape_when_dragging beam crosshair

#: Threshold distance for drag and drop (pixels)
# drag_threshold 5

#: Remove all default mouse action definitions
# clear_all_mouse_actions no

#: Mouse action mappings (see documentation for details)
#: Format: mouse_map button-name event-type modes action
# mouse_map left click ungrabbed mouse_handle_click selection link prompt
# mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection link prompt
# mouse_map ctrl+shift+left release grabbed,ungrabbed mouse_handle_click link
# mouse_map ctrl+shift+left press grabbed discard_event
# mouse_map middle release ungrabbed paste_from_selection
# mouse_map left press ungrabbed mouse_selection normal
# mouse_map ctrl+alt+left press ungrabbed mouse_selection rectangle
# mouse_map left doublepress ungrabbed mouse_selection word
# mouse_map left triplepress ungrabbed mouse_selection line
# mouse_map alt+left triplepress ungrabbed mouse_selection line_from_begin
# mouse_map ctrl+alt+left triplepress ungrabbed mouse_selection line_from_point
# mouse_map right press ungrabbed mouse_selection extend
# mouse_map shift+left press ungrabbed mouse_selection extend

#: }}}

#: ============================================================================
#: TEXT CURSOR CUSTOMIZATION {{{
#: ============================================================================

shell_integration no-rc

#: }}}

#: ============================================================================
#: APPEARANCE {{{
#: ============================================================================

#: Background opacity (0.0 = transparent, 1.0 = opaque)
background_opacity 0.88

#: Dim text in unfocused windows
# dim_opacity 0.75

#: }}}

#: ============================================================================
#: WINDOW CONFIGURATION {{{
#: ============================================================================

#: Remember window size on restart
remember_window_size yes

#: Hide window decorations (title bar, borders)
hide_window_decorations yes

#: Draw minimal borders between windows
draw_minimal_borders yes

#: Window border width (in pts)
window_border_width 0.1

#: Box drawing scale for Unicode box drawing characters
box_drawing_scale 0.001, 0.70, 0.70, 0.70

#: Margin around windows (top, bottom, left, right)
# window_margin_width 0
# window_margin_height 0

#: Padding inside windows (top, bottom, left, right)
# window_padding_width 0
# window_padding_height 0

#: Resize window in increments of cell size
# resize_in_steps no

#: Initial window width and height (in cells or pixels)
# initial_window_width 80
# initial_window_height 24

#: Placement of new windows: top-left, top, top-right, left, center, right, bottom-left, bottom, bottom-right
# placement_strategy center

#: Confirm before closing window with unsaved content
# confirm_os_window_close 0

#: }}}

#: ============================================================================
#: PERFORMANCE {{{
#: ============================================================================

#: Terminal type to report to programs
term xterm-kitty

#: Repaint delay (in milliseconds)
repaint_delay 10

#: Input delay (in milliseconds)
input_delay 3

#: Sync to monitor refresh rate
sync_to_monitor no

#: }}}

#: ============================================================================
#: TABS CONFIGURATION {{{
#: ============================================================================

#: Tab bar position: top or bottom
tab_bar_edge            bottom

#: Minimum number of tabs to show tab bar
tab_bar_min_tabs        1

#: Tab bar style: fade, slant, separator, powerline, custom
tab_bar_style           powerline

#: Powerline style: angled, slanted, round
tab_powerline_style     angled

#: Tab separator
tab_separator           " |"

#: Tab bar margin width (left, right)
tab_bar_margin_width    0.0

#: Tab bar margin height (top, bottom)
tab_bar_margin_height   0.0 0.0

#: Tab title template
tab_title_template "{index}: {title[:15]}{"…" if len(title) > 15 else ""}{bell_symbol}"

#: Active tab title template
active_tab_title_template   "{fmt.bold}{index}: {title[:15]}{"…" if len(title) > 15 else ""}{activity_symbol}{fmt.nobold}"

#: Bell symbol on tab
bell_on_tab                " * "

#: Tab activity symbol
tab_activity_symbol         "+ "

#: Tab bar background color
# tab_bar_background none

#: Tab bar foreground color
# tab_bar_foreground #000

#: Active tab background color
# active_tab_background #eee

#: Active tab foreground color
# active_tab_foreground #000

#: Inactive tab background color
# inactive_tab_background #999

#: Inactive tab foreground color
# inactive_tab_foreground #000

#: }}}

#: ============================================================================
#: BEHAVIOR {{{
#: ============================================================================

#: Enable audio bell
enable_audio_bell no

#: Visual bell duration (in seconds)
visual_bell_duration 0.0

#: Close window when child process dies
close_on_child_death yes

#: Allow remote control via kitty @ commands
allow_remote_control yes

#: Listen on Unix socket for remote control
listen_on unix:/tmp/kitty

#: Enabled window layouts
enabled_layouts tall,splits

#: Tab bar filter (show tabs matching condition)
tab_bar_filter session:~ or session:^$

#: Startup session
startup_session ~/.config/kitty/sessions/home.kitty-session

#: Clipboard control: write-clipboard, write-primary, read-clipboard, read-primary
clipboard_control write-clipboard write-primary read-clipboard read-primary

#: }}}

#: ============================================================================
#: KEYBOARD SHORTCUTS {{{
#: ============================================================================

#: Clear all default shortcuts
clear_all_shortcuts yes

#: ============================================================================
#: Clipboard Operations
#: ============================================================================

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v combine : paste_from_clipboard : clear_selection
map alt+p combine : paste_from_clipboard : clear_selection

#: ============================================================================
#: Hints & Unicode Input
#: ============================================================================

map ctrl+space kitten hints --type line
map opt+insert kitten unicode_input

#: ============================================================================
#: Scrolling
#: ============================================================================

map opt+k scroll_line_up
map opt+j scroll_line_down
map opt+u scroll_page_up
map opt+d scroll_page_down
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down

#: ============================================================================
#: Font Size Adjustment
#: ============================================================================

map opt+shift+k change_font_size all +1.0
map opt+shift+j change_font_size all -1.0
map opt+shift+space change_font_size all 0

#: ============================================================================
#: Modal Mode — tmux-like prefix (Ctrl+S then key, Esc to quit)
#: ============================================================================

map --new-mode mw --on-action end ctrl+s
map --mode mw esc pop_keyboard_mode

#: Window navigation (vim-style)
map --mode mw h         neighboring_window left
map --mode mw j         neighboring_window down
map --mode mw k         neighboring_window up
map --mode mw l         neighboring_window right

#: Move window
map --mode mw shift+h   move_window left
map --mode mw shift+j   move_window down
map --mode mw shift+k   move_window up
map --mode mw shift+l   move_window right

#: Resize window
# map --mode mw n         resize_window narrower
map --mode mw b         resize_window wider
map --mode mw t         resize_window taller
map --mode mw s         resize_window shorter

#: Split & window management
map --mode mw enter      launch --cwd=current
map --mode mw shift+0x27 launch --cwd=current --location=hsplit
map --mode mw %          launch --cwd=current --location=vsplit
map --mode mw x          close_window
map --mode mw space      next_window
map --mode mw z          toggle_fullscreen
map --mode mw tab        nth_window -1
map --mode mw 1          first_window
map --mode mw 2          second_window
map --mode mw 3          third_window

#: Tab management
map --mode mw c         launch --cwd=current --type=tab
map --mode mw n         next_tab
map --mode mw p         previous_tab
map --mode mw q         close_tab
map --mode mw ,         set_tab_title

#: Scrollback
#: Opens scrollback in overlay window with nvim in normal mode
#: Features: clean text (no ANSI codes), numbers shown, read-only mode, full nvim functionality
#: Cursor positioned at first line with content (normal! gg)
#: Removes empty lines (:%s/^$//g)
map --mode mw [         launch --stdin-source=@screen_scrollback --type=overlay nvim +'nnoremap q ZQ' +'set number relativenumber readonly nolist' +'normal! G$' -

#: Layout
map --mode mw o         next_layout

#: Sessions
map --mode mw ctrl+h     goto_session ~/.config/kitty/sessions/home.kitty-session
map --mode mw ctrl+p     goto_session ~/.config/kitty/sessions/projects.kitty-session
map --mode mw w          launch --type=overlay ~/.config/kitty/scripts/kitty-list-sessions.sh
map --mode mw f          launch --type=overlay ~/.config/kitty/scripts/kitty-new-session.sh
map --mode mw ctrl+s     save_as_session --use-foreground-process --relocatable

#: ============================================================================
#: Global Shortcuts
#: ============================================================================

#: Resize — Ctrl+Alt+hjkl
map ctrl+alt+h resize_window narrower 2
map ctrl+alt+j resize_window shorter 2
map ctrl+alt+k resize_window taller 2
map ctrl+alt+l resize_window wider 2

#: Tab selection — Alt+1..9
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

#: }}}

#: ============================================================================
#: ADVANCED CONFIGURATION (Optional - Uncomment as needed)
#: ============================================================================

#: Shell Integration
#: Enables shell integration for better prompt detection and command tracking
# shell_integration enabled

#: Wayland-specific settings
# wayland_titlebar_color system

#: X11-specific settings
# x11_hide_window_decorations auto

#: macOS-specific settings
# macos_option_as_alt yes
# macos_hide_from_tasks no
# macos_quit_when_last_window_closed no
# macos_window_resizable yes
# macos_thicken_font 0
# macos_traditional_fullscreen no
# macos_custom_beam_cursor no
# macos_colorspace srgb

#: Linux-specific settings
# linux_display_server auto

#: }}}

#: ============================================================================
#: END OF CONFIGURATION
