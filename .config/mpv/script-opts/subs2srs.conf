###
### Main mpvacious configuration file.
###

##
## General settings
##

# Anki deck for new cards
deck_name=3.AllJapaneseAllTheTime::subs2srs

# Note type name
model_name=Japanese sentences

# Field names as they appear in your note type
sentence_field=SentKanji
secondary_field=SentEng
audio_field=SentAudio
image_field=Image

# Tags added to new notes
note_tag=subs2srs

# Menu font settings
menu_font_size=24
menu_font_name=Noto Sans CJK JP

# AnkiConnect server address
ankiconnect_url=127.0.0.1:8765

##
## Toggleables
##

# Use FFmpeg encoder instead of mpv encoder
# If mpvacious encounters problems creating audio and images for Anki cards,
# setting this to `yes` should fix them.
#
# You need to install ffmpeg and add it to the PATH first.
# https://wiki.archlinux.org/title/FFmpeg
# https://www.ffmpeg.org/download.html
#
# FFmpeg encoder is unable to create audio and images from remote content (like YouTube videos).
use_ffmpeg=yes

# Automatically create deck for new cards
create_deck=no

# Allow duplicate notes
allow_duplicates=yes

# Auto-copy subtitles to clipboard
autoclip=no

# Remove spaces for languages without spaces (Japanese)
nuke_spaces=yes

# Preview audio after note creation
preview_audio=no

# Check for updates on startup
check_for_updates=no

##
## Image settings
##

snapshot_format=avif
snapshot_quality=15
snapshot_width=-2
snapshot_height=350

##
## Audio settings
##

audio_format=opus
opus_container=ogg
audio_bitrate=24k
audio_padding=0.0

##
## Loudness normalization
##

loudnorm=yes
loudnorm_target=-16
loudnorm_range=11
loudnorm_peak=-1.5

##
## Secondary subtitles
##

secondary_sub_auto_load=yes
secondary_sub_lang=en,eng
secondary_sub_area=0.15
secondary_sub_visibility=auto

##
## New note timer
##

enable_new_note_timer=yes
new_note_timer_interval_seconds=2
